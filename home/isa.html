<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores para ti ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, LightSkyBlue, LightPink);
      font-family: 'Bradley Hand ITC', cursive;
      overflow: hidden;
    }

    canvas {
      border: 4px solid Chocolate;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .message {
      position: absolute;
      bottom: 20px;
      font-size: 48px;
      font-weight: bold;
      color: Chocolate;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: fadeIn 2s ease-in-out infinite alternate;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0.6;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sparkle {
      position: absolute;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, white, transparent);
      border-radius: 50%;
      opacity: 0.7;
      animation: sparkleAnimation 1.5s infinite ease-in-out;
    }

    @keyframes sparkleAnimation {
      0%, 100% {
        transform: scale(1);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.5);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <canvas id="flowerCanvas" width="800" height="600"></canvas>
  <div class="message">I LOVE YOU KAREN ❤️</div>

  <script>
    const canvas = document.getElementById('flowerCanvas');
    const ctx = canvas.getContext('2d');

    function drawPetal(x, y, radiusX, radiusY, rotation, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.beginPath();
      ctx.ellipse(0, 0, radiusX, radiusY, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawFlower(x, y, petalColor, centerColor) {
      const petalCount = 6;
      const petalRadiusX = 50;
      const petalRadiusY = 100;
      const angleStep = (Math.PI * 2) / petalCount;

      for (let i = 0; i < petalCount; i++) {
        drawPetal(x, y, petalRadiusX, petalRadiusY, i * angleStep, petalColor);
      }

      // Draw center
      ctx.beginPath();
      ctx.fillStyle = centerColor;
      ctx.arc(x, y, 35, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLeaf(x, y, width, height, rotation, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(width / 2, -height / 2, width, 0);
      ctx.quadraticCurveTo(width / 2, height / 2, 0, 0);
      ctx.fill();
      ctx.restore();
    }

    function createSparkle(x, y) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = `${x}px`;
      sparkle.style.top = `${y}px`;
      document.body.appendChild(sparkle);
    }

    function createArt() {
      // Draw flowers
      drawFlower(400, 300, "Pink", "Gold");
      drawFlower(200, 150, "Tomato", "Orange");
      drawFlower(600, 150, "SteelBlue", "DarkTurquoise");
      
      // Draw leaves
      drawLeaf(300, 500, 150, 80, Math.PI / 6, "LawnGreen");
      drawLeaf(500, 500, 150, 80, -Math.PI / 6, "LimeGreen");

      // Add sparkles
      const sparklePositions = [
        { x: 100, y: 100 },
        { x: 700, y: 500 },
        { x: 400, y: 50 },
        { x: 600, y: 400 },
        { x: 250, y: 450 }
      ];

      sparklePositions.forEach(pos => createSparkle(pos.x, pos.y));
    }

    createArt();
  </script>
</body>
</html>
